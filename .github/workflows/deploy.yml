name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OBS_ROOT: qa-artifacts/run-observability/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: |
          set -o pipefail
          mkdir -p "$OBS_ROOT/logs"
          pnpm install --frozen-lockfile |& tee "$OBS_ROOT/logs/01-install-dependencies.log"

      - name: Build
        run: |
          set -o pipefail
          mkdir -p "$OBS_ROOT/logs"
          pnpm --filter @homepage/web build |& tee "$OBS_ROOT/logs/02-build.log"
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '' }}
          NEXT_PUBLIC_CONTACT_EMAIL: help@lovizu.com

      - name: Verify static export artifact
        run: |
          set -o pipefail
          mkdir -p "$OBS_ROOT/logs"
          {
            test -d apps/web/out || { echo "Missing apps/web/out"; exit 1; }
            test -f apps/web/out/index.html || { echo "Missing apps/web/out/index.html"; exit 1; }
            echo "Export root files:"
            ls -la apps/web/out | sed -n '1,40p'
          } |& tee "$OBS_ROOT/logs/03-verify-static-export-artifact.log"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - name: Finalize run observability artifact
        if: always()
        run: ./scripts/collect-run-observability.sh "$OBS_ROOT"
        env:
          WORKFLOW_JOB_STATUS: ${{ job.status }}

      - name: Upload run observability artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-observability-deploy-build-${{ github.run_id }}
          path: ${{ env.OBS_ROOT }}
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "Pages URL: ${{ steps.deployment.outputs.page_url }}"
