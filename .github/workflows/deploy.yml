name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OBS_ROOT: qa-artifacts/run-observability/${{ github.run_id }}
    steps:
      - name: Initialize run observability
        id: observability_init
        run: |
          mkdir -p "$OBS_ROOT/step-logs"
          cat <<EOF > "$OBS_ROOT/step-logs/00-bootstrap.log"
          step=Initialize run observability
          workflow=${{ github.workflow }}
          job=build
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          sha=${{ github.sha }}
          ref=${{ github.ref }}
          actor=${{ github.actor }}
          repo=${{ github.repository }}
          event_name=${{ github.event_name }}
          triggered_by=${{ github.event_name }}
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Record checkout step
        if: always()
        run: |
          mkdir -p "$OBS_ROOT/step-logs"
          cat <<'EOF' > "$OBS_ROOT/step-logs/00-checkout.log"
          step=Checkout
          kind=action
          outcome=${{ steps.checkout.outcome }}
          EOF

      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Record setup pnpm step
        if: always()
        run: |
          mkdir -p "$OBS_ROOT/step-logs"
          cat <<'EOF' > "$OBS_ROOT/step-logs/01-setup-pnpm.log"
          step=Setup pnpm
          kind=action
          outcome=${{ steps.setup_pnpm.outcome }}
          EOF

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Record setup node step
        if: always()
        run: |
          mkdir -p "$OBS_ROOT/step-logs"
          cat <<'EOF' > "$OBS_ROOT/step-logs/02-setup-node.log"
          step=Setup Node.js
          kind=action
          outcome=${{ steps.setup_node.outcome }}
          EOF

      - name: Install dependencies
        run: |
          set -o pipefail
          mkdir -p "$OBS_ROOT/step-logs"
          pnpm install --frozen-lockfile |& tee "$OBS_ROOT/step-logs/03-install-dependencies.log"

      - name: Build
        run: |
          set -o pipefail
          mkdir -p "$OBS_ROOT/step-logs"
          pnpm --filter @homepage/web build |& tee "$OBS_ROOT/step-logs/04-build.log"
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '' }}
          NEXT_PUBLIC_CONTACT_EMAIL: help@lovizu.com

      - name: Verify static export artifact
        run: |
          set -o pipefail
          mkdir -p "$OBS_ROOT/step-logs"
          {
            test -d apps/web/out || { echo "Missing apps/web/out"; exit 1; }
            test -f apps/web/out/index.html || { echo "Missing apps/web/out/index.html"; exit 1; }
            echo "Export root files:"
            ls -la apps/web/out | sed -n '1,40p'
          } |& tee "$OBS_ROOT/step-logs/05-verify-static-export-artifact.log"

      - name: Configure Pages
        id: configure_pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Record configure pages step
        if: always()
        run: |
          mkdir -p "$OBS_ROOT/step-logs"
          cat <<'EOF' > "$OBS_ROOT/step-logs/06-configure-pages.log"
          step=Configure Pages
          kind=action
          outcome=${{ steps.configure_pages.outcome }}
          EOF

      - name: Upload artifact
        id: upload_pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - name: Record upload artifact step
        if: always()
        run: |
          mkdir -p "$OBS_ROOT/step-logs"
          cat <<'EOF' > "$OBS_ROOT/step-logs/07-upload-pages-artifact.log"
          step=Upload artifact
          kind=action
          outcome=${{ steps.upload_pages_artifact.outcome }}
          EOF

      - name: Finalize run observability artifact
        if: always()
        run: ./scripts/collect-run-observability.sh "$OBS_ROOT"
        env:
          WORKFLOW_JOB_STATUS: ${{ job.status }}

      - name: Upload run observability artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-observability-deploy-build-${{ github.run_id }}
          path: ${{ env.OBS_ROOT }}
          if-no-files-found: error
          retention-days: 14

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    env:
      OBS_ROOT: qa-artifacts/run-observability/${{ github.run_id }}
    steps:
      - name: Initialize deploy run observability
        id: deploy_observability_init
        run: |
          mkdir -p "$OBS_ROOT/step-logs"
          cat <<EOF > "$OBS_ROOT/step-logs/00-bootstrap.log"
          step=Initialize deploy run observability
          workflow=${{ github.workflow }}
          job=deploy
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          sha=${{ github.sha }}
          ref=${{ github.ref }}
          actor=${{ github.actor }}
          repo=${{ github.repository }}
          event_name=${{ github.event_name }}
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deploy step
        if: always()
        run: |
          mkdir -p "$OBS_ROOT/step-logs"
          cat <<'EOF' > "$OBS_ROOT/step-logs/01-deploy-to-github-pages.log"
          step=Deploy to GitHub Pages
          kind=action
          outcome=${{ steps.deployment.outcome }}
          page_url=${{ steps.deployment.outputs.page_url }}
          EOF

      - name: Deployment summary
        if: always()
        run: |
          set -o pipefail
          mkdir -p "$OBS_ROOT/step-logs"
          echo "Pages URL: ${{ steps.deployment.outputs.page_url }}" |& tee "$OBS_ROOT/step-logs/02-deployment-summary.log"

      - name: Finalize deploy observability artifact
        if: always()
        run: ./scripts/collect-run-observability.sh "$OBS_ROOT" ""
        env:
          WORKFLOW_JOB_STATUS: ${{ job.status }}

      - name: Upload deploy observability artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-observability-deploy-job-${{ github.run_id }}
          path: ${{ env.OBS_ROOT }}
          if-no-files-found: error
          retention-days: 14
